name: Expand project bundle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project source
        run: |
          test -f project.zip
          unzip -o project.zip -d .
          rm -f project.zip .github/workflows/deploy_bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy Industrial Quality Documentation Assistant"
          git push
