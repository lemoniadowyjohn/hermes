name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iqda-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Static type analysis
        run: mypy src/iqda
      - name: Unit tests with coverage evidence
        run: pytest --cov=iqda --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Synthetic evaluation
        run: python scripts/evaluate.py
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Reproducible package build
        run: python -m build
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iqda-quality-evidence
          path: |
            coverage.xml
            artifacts/
            dist/
          if-no-files-found: warn
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --pull -t iqda:test .
      - name: Start container
        run: docker run -d --rm -p 8000:8000 --name iqda-smoke iqda:test
      - name: Verify health endpoint
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs iqda-smoke
          exit 1
      - name: Capture container diagnostics
        if: always()
        run: docker logs iqda-smoke > container-smoke.log 2>&1 || true
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iqda-container-smoke
          path: container-smoke.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop container
        if: always()
        run: docker stop iqda-smoke || true
